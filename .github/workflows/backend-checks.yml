name: ReliefMesh backend PostgreSQL checks

on:
  push:
    branches: [main, integration]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-checks.yml'
  pull_request:
    branches: [main, integration]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reliefmesh
          POSTGRES_PASSWORD: reliefmesh
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reliefmesh -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://reliefmesh:reliefmesh@localhost:5432/reliefmesh_test
      TEST_DATABASE_URL: postgresql+psycopg2://reliefmesh:reliefmesh@localhost:5432/reliefmesh_test
      AUTH_ENABLED: 'false'
      APP_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Run PostgreSQL backend tests
        run: python -m pytest -q
